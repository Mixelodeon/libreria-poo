<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Librería Aurora</title>
    <link rel="stylesheet" href="../css/login.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <main class="login-page">
        <div class="login-container">
            <!-- LOGO -->
            <div class="login-logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <h1>Librería</h1>
            </div>

            <div class="login-card">
                <div class="login-header">
                    <h2>Bienvenido de nuevo</h2>
                    <p>Inicia sesión para continuar</p>
                </div>
                <form class="login-form">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <div class="input-container">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="email" name="email" placeholder="Introduce tu correo electrónico"
                                required>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="password-label">
                            <label for="password">Contraseña</label>
                            <a href="#">¿Has olvidado tu contraseña?</a>
                        </div>
                        <div class="input-container">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Introduce tu contraseña"
                                required>
                            <button type="button" class="show-password" onclick="togglePassword()">
                                <i class="fa-solid fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="submitButton">Iniciar sesión</button>
                </form>

                <!-- REGISTRO -->
                <div class="register">
                    <span>
                        ¿No tienes una cuenta?
                    </span>
                    <a href="./register.html">Crear cuenta</a>
                </div>
            </div>
            <!-- VOLVER -->
            <a href="../index.html" class="back-home">
                Volver a la página principal
            </a>
        </div>
    </main>

    <script src="../js/login.js"></script>

</body>

</html>
