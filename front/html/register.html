<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta - Librería Aurora</title>

    <link rel="stylesheet" href="../css/register.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <main class="register-page">
        <div class="register-container">
            <div class="register-logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <h1>Librería</h1>
            </div>
            <div class="register-card">
                <div class="register-header">
                    <h2>Crear una cuenta</h2>
                    <p>Regístrate para disfrutar de todas las ventajas</p>
                </div>
                <form class="register-form">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <div class="input-container">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="apellidos">Apellidos</label>
                        <div class="input-container">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="apellidos" name="apellidos" placeholder="Introduce tus apellidos"
                                required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <div class="input-container">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-container">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Introduce una contraseña"
                                required>
                            <button type="button" class="show-password"
                                onclick="togglePassword('password', 'eyeIcon1')">
                                <i class="fa-solid fa-eye" id="eyeIcon1"></i>
                            </button>
                        </div>
                        <span class="password-info">La contraseña debe tener al menos 8 caracteres.</span>
                    </div>
                    <div class="form-group">
                        <label for="passwordVerification">Repetir contraseña</label>
                        <div class="input-container">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="passwordVerification" name="passwordVerification"
                                placeholder="Repite tu contraseña" required>
                            <button type="button" class="show-password"
                                onclick="togglePassword('passwordVerification', 'eyeIcon2')">
                                <i class="fa-solid fa-eye" id="eyeIcon2"></i>
                            </button>
                        </div>
                    </div>
                    <button type="button" class="register-button" id="submitButton">Crear cuenta
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
                <div class="login-link">
                    <span>¿Ya tienes una cuenta?</span>
                    <a href="./login.html">Iniciar sesión</a>
                </div>
            </div>
            <a href="../index.html" class="back-home">
                <i class="fa-solid fa-arrow-left"></i>
                Volver a la página principal
            </a>
        </div>
    </main>

    <script src="../js/register.js"></script>

</body>

</html>
