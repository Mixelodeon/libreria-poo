<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Librería POO</title>
    <!-- Cargamos tu CSS principal para colores base, y uno nuevo para el layout del admin -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="admin-body">

    <!-- MENÚ LATERAL (SIDEBAR) -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h2>Admin<span class="highlight">POO</span></h2>
        </div>

        <ul class="sidebar-menu">
            <!-- Les quitamos la clase 'activo' inicial y les ponemos IDs -->
            <li><a href="#" id="nav-libros"><i class="fas fa-book"></i> Gestión de Libros</a></li>
            <li><a href="#" id="nav-usuarios"><i class="fas fa-users"></i> Gestión de Usuarios</a></li>
            <li><a href="#" id="nav-pedidos"><i class="fas fa-box-open"></i> Pedidos y Ventas</a></li>
        </ul>

        <div class="sidebar-bottom">
            <a href="../index.html"><i class="fas fa-store"></i> Acceder a la Tienda</a>
            <a href="#" id="btn-logout-admin" style="color: #ff4757;"><i class="fas fa-sign-out-alt"></i> Cerrar
                Sesión</a>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="admin-content">
        <header class="admin-header">
            <!-- El título cambiará con JS según dónde estemos -->
            <h1 id="titulo-seccion">Inicio</h1>
            <div class="admin-perfil">
                <span id="nombre-admin">Cargando...</span>
                <i class="fas fa-user-shield" style="font-size: 24px; color: var(--verde-principal);"></i>
            </div>
        </header>

        <!-- PANEL 0: BIENVENIDA EN GRANDE (Visible por defecto) -->
        <section id="panel-bienvenida" class="admin-panel" style="text-align: center; padding: 60px 20px;">
            <i class="fas fa-hand-spock"
                style="font-size: 50px; color: var(--verde-principal); margin-bottom: 20px;"></i>
            <h2 style="font-size: 32px; color: var(--verde-oscuro); margin-bottom: 15px;">¡Bienvenido al Panel de
                Control!</h2>
            <p style="font-size: 18px; color: var(--texto-claro);">Selecciona una opción en el menú lateral para
                gestionar el catálogo, los usuarios o las ventas.</p>
        </section>

        <!-- PANEL 1: FORMULARIO DE LIBROS (Oculto por defecto con display: none) -->
        <section id="panel-libros" class="admin-panel" style="display: none;">
            <form id="form-nuevo-libro" class="formulario-admin">

                <div class="form-grupo">
                    <label for="titulo">Título del Libro</label>
                    <input type="text" id="titulo" required placeholder="Ej: Alas de ónix">
                </div>

                <div class="form-row">
                    <div class="form-grupo">
                        <label for="autor">Autor</label>
                        <input type="text" id="autor" required>
                    </div>
                    <div class="form-grupo">
                        <label for="editorial">Editorial</label>
                        <input type="text" id="editorial" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-grupo">
                        <label for="precio">Precio (€)</label>
                        <input type="number" id="precio" step="0.01" required>
                    </div>
                    <div class="form-grupo">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" required>
                            <option value="Fantasía">Fantasía</option>
                            <option value="Terror y Suspense">Terror y Suspense</option>
                            <option value="Ciencia Ficción">Ciencia Ficción</option>
                            <option value="Drama">Drama</option>
                            <option value="Programación">Programación</option>
                        </select>
                    </div>
                    <div class="form-grupo">
                        <label for="numPaginas">Nº Páginas</label>
                        <input type="number" id="numPaginas" required>
                    </div>
                </div>

                <div class="form-grupo">
                    <label for="portadaURL">Nombre del archivo de Portada</label>
                    <input type="text" id="portadaURL" required placeholder="Ej: portada.jpg">
                </div>

                <button type="submit" class="btn-agregar" style="margin-top: 20px;">
                    <i class="fas fa-save"></i> Guardar Libro en Base de Datos
                </button>
            </form>
        </section>
    </main>

    <script src="../js/admin.js"></script>
</body>

</html>
